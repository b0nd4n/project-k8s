name: Build, Push, and Deploy Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: 192.168.110.206:5000
  IMAGE_NAME: my-app

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .
        docker tag $REGISTRY/$IMAGE_NAME:${{ github.sha }} $REGISTRY/$IMAGE_NAME:latest

    - name: Push Image to Private Registry
      run: |
        docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
        docker push $REGISTRY/$IMAGE_NAME:latest

    - name: Deploy to Kubernetes
      run: |
        # Set image baru pada deployment Kubernetes
        kubectl create deployment my-app --image=$REGISTRY/$IMAGE_NAME:${{ github.sha }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl rollout status deployment/my-app
