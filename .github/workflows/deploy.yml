name: Build, Push, and Deploy Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: 192.168.110.206:5000
  IMAGE_NAME: my-app

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .
        docker tag $REGISTRY/$IMAGE_NAME:${{ github.sha }} $REGISTRY/$IMAGE_NAME:latest

    - name: Push Image to Private Registry
      run: |
        docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
        docker push $REGISTRY/$IMAGE_NAME:latest

    - name: Deploy & Inject Secret to Kubernetes
      run: |
        # 1. Update image deployment
        kubectl set image deployment/my-app my-app=$REGISTRY/$IMAGE_NAME:${{ github.sha }} || \
        kubectl create deployment my-app --image=$REGISTRY/$IMAGE_NAME:${{ github.sha }}

        # 2. Inject environment variables dari Kubernetes Secret (db-credentials) ke Pod
        kubectl set env deployment/my-app --from=secret/db-credentials

        # 3. Tunggu rollout selesai
        kubectl rollout status deployment/my-app
